<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/gotham-pro-font@1.0.0/fonts.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/fancybox.css">
    <link rel="stylesheet" href="css/old-styles.css">
    <link rel="stylesheet" href="css/news__slider.css">
    <link rel="stylesheet" href="css/current-styles.css">
    <link rel="stylesheet" href="css/gallery.css">

    <title>Описание направления</title>
</head>

<body>
    <section class="main__gallery white-bkg">
        <div class="container">
            <div class="container__content">
                <div class="title"><span>Наша</span> клиника</div>
            </div>
            <div class="gallery__hor">
                <div class="gallery__hor__swiper swiper-initialized swiper-horizontal swiper-pointer-events">
                    <div class="gallery__hor__wrapper swiper-wrapper">
                        <div class="gallery__hor__item gallery__hor__item--video swiper-slide swiper-slide-active" role="group" aria-label="1 / 6"
                            style="margin-right: 8px;">
                            <img src="./img/video.png" class="gallery__hor__item-label" alt="">
                            <img src="https://osnova-clinic.ru/assets/cache_image/upload/images/technology/untitled-00222_800x600_057.jpg"
                                alt="Основа">
                        </div>
                        <div class="gallery__hor__item swiper-slide swiper-slide-next" role="group" aria-label="2 / 6"
                            style="margin-right: 8px;">
                            <img src="https://osnova-clinic.ru/assets/cache_image/upload/images/technology/6566_800x600_057.jpg" alt="Основа">
                        </div>
                        <div class="gallery__hor__item swiper-slide" role="group" aria-label="3 / 6"
                            style="margin-right: 8px;">
                            <img src="https://osnova-clinic.ru/assets/cache_image/upload/images/technology/XXXL_800x600_5c2.jpeg" alt="Основа">
                        </div>
                        <div class="gallery__hor__item swiper-slide" role="group" aria-label="4 / 6"
                            style="margin-right: 8px;">
                            <img src="https://osnova-clinic.ru/assets/cache_image/upload/untitled-00131_800x600_057.jpg" alt="Основа">
                        </div>
                        <div class="gallery__hor__item swiper-slide" role="group" aria-label="5 / 6"
                            style="margin-right: 8px;">
                            <img src="https://osnova-clinic.ru/assets/cache_image/upload/images/technology/untitled-00211_800x600_057.jpg"
                                alt="Основа">
                        </div>
                        <div class="gallery__hor__item swiper-slide" role="group" aria-label="6 / 6"
                            style="margin-right: 8px;">
                            <img src="https://osnova-clinic.ru/assets/cache_image/upload/untitled-00168_800x600_057.jpg" alt="Основа">
                        </div>
                    </div>
                    <span class="swiper-notification" aria-live="assertive" aria-atomic="true"></span>
                </div>
                <div class="gallery__hor__btns btns__lr btns__lr-col swiper-buttons flex">
                    <div class="btn btn__round btn__round-lg grey__middle-bkg gallery__hor-next" tabindex="0"
                        role="button" aria-label="Next slide" aria-controls="swiper-wrapper-f9c066c8610602ed2"
                        aria-disabled="false">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M8.29289 5.29289C8.68342 4.90237 9.31658 4.90237 9.70711 5.29289L15.7071 11.2929C16.0976 11.6834 16.0976 12.3166 15.7071 12.7071L9.70711 18.7071C9.31658 19.0976 8.68342 19.0976 8.29289 18.7071C7.90237 18.3166 7.90237 17.6834 8.29289 17.2929L13.5858 12L8.29289 6.70711C7.90237 6.31658 7.90237 5.68342 8.29289 5.29289Z"
                                fill="white"></path>
                        </svg>
                    </div>
                    <div class="btn btn__round btn__round-lg grey__middle-bkg gallery__hor-prev swiper-button-disabled"
                        tabindex="-1" role="button" aria-label="Previous slide"
                        aria-controls="swiper-wrapper-f9c066c8610602ed2" aria-disabled="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M15.7071 5.29289C16.0976 5.68342 16.0976 6.31658 15.7071 6.70711L10.4142 12L15.7071 17.2929C16.0976 17.6834 16.0976 18.3166 15.7071 18.7071C15.3166 19.0976 14.6834 19.0976 14.2929 18.7071L8.29289 12.7071C7.90237 12.3166 7.90237 11.6834 8.29289 11.2929L14.2929 5.29289C14.6834 4.90237 15.3166 4.90237 15.7071 5.29289Z"
                                fill="white"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"></script>
    <script src="js/fancybox.js"></script>
    <script src="js/main.js"></script>

</html>
